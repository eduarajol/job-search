<title>Job Search</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column dashboard. Header band, filter bar, then company cards grouped by type, in Eduard's sand + oxblood palette. */
:root {
  --ground: #F5F0E8;
  --paper: #FFFBF4;
  --ink: #4B1D26;
  --ink-soft: #6B5357;
  --red: #B92B45;
  --teal: #0F6E62;
  --sand: #EBD3A8;
  --line: rgba(75, 29, 38, .14);
  --chip: #F1E4CF;
  --good: #1E7A4C; --good-bg: #DCEFE3;
  --warn: #9A6200; --warn-bg: #F6E7C8;
  --bad: #B3261E; --bad-bg: #F7DCD9;
  --display: 'Bricolage Grotesque', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1C1315; --paper: #281C1F; --ink: #F3E6E1; --ink-soft: #C4AEB0;
    --red: #E8768B; --teal: #5CC2AF; --sand: #5B4631; --line: rgba(243, 230, 225, .14);
    --chip: #3A2A22; color-scheme: dark;
    --good: #6CCB97; --good-bg: #1F3A2B; --warn: #E6B45A; --warn-bg: #3D3020; --bad: #F08A80; --bad-bg: #44231F;
  }
}
:root[data-theme="dark"] {
  --ground: #1C1315; --paper: #281C1F; --ink: #F3E6E1; --ink-soft: #C4AEB0;
  --red: #E8768B; --teal: #5CC2AF; --sand: #5B4631; --line: rgba(243, 230, 225, .14);
  --chip: #3A2A22; color-scheme: dark;
  --good: #6CCB97; --good-bg: #1F3A2B; --warn: #E6B45A; --warn-bg: #3D3020; --bad: #F08A80; --bad-bg: #44231F;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--display); font-size: 15px; line-height: 1.45;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }

.wrap {
  max-width: 1260px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Header */
.top { background: var(--sand); border-bottom: 2px solid var(--ink); }
.top .wrap { padding-block: 28px 22px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
.brand h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: .95; font-weight: 800; letter-spacing: -1.5px; text-wrap: balance; }
.brand h1 span { color: var(--red); }
.brand p { margin: 8px 0 0; color: var(--ink-soft); font-size: 16px; }
.stamp { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); text-align: right; }
.stamp b { display: block; font-family: var(--display); font-size: 15px; color: var(--ink); font-weight: 600; }

/* Filters */
.bar .wrap { padding-block: 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ink);
  background: transparent; color: var(--ink); font: 600 14px var(--display); cursor: pointer;
}
.toggle .dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; }
.toggle[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
.toggle[aria-pressed="true"] .dot { background: currentColor; }
.toggle .gem { margin-top: 0; }
.toggle[aria-pressed="true"] .gem.gd, .toggle[aria-pressed="true"] .gem.ux { background: var(--ground); }
.toggle .pin { width: 14px; height: 14px; }
.chips { display: contents; }
.chips .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
.search {
  flex: 1 1 200px; min-width: 0; min-height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 400 14px var(--display);
}
.search::placeholder { color: var(--ink-soft); }

.summary { display: flex; flex-wrap: wrap; gap: 8px 22px; padding-block: 4px 18px; color: var(--ink-soft); font-size: 14px; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* Sections */
main .wrap { padding-block: 4px 56px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 28px; align-items: start; }
#app { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .picks { order: -1; position: static; max-height: none; }
}

/* Top-10 panel */
.picks { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 16px 16px 8px; }
.picks h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.4px; }
.picks .by { margin: 2px 0 10px; font: 400 12px var(--mono); color: var(--ink-soft); }
.picks ol { list-style: none; margin: 0; padding: 0; }
.picks li + li { border-top: 1px solid var(--line); }
.pick { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 2px 10px; padding: 11px 0; text-decoration: none; }
.pick:hover .t { text-decoration: underline; text-underline-offset: 2px; }
.rank { grid-row: 1 / span 5; font: 500 20px var(--mono); color: var(--red); line-height: 1.1; font-variant-numeric: tabular-nums; }
.pick .ptop { display: flex; align-items: center; gap: 8px; min-width: 0; }
.pick .logo { width: 28px; height: 28px; border-radius: 7px; font-size: 11px; }
.pick .gem { margin-top: 0; flex-shrink: 0; }
.pick .meta { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.pick .meta .co { color: var(--ink); font-weight: 600; }
.pick .meta i { color: var(--ink); }
.why { font-size: 13px; line-height: 1.4; color: var(--ink); text-wrap: pretty; }
.fit { flex-shrink: 0; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font: 500 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
.fit .ico { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; border: 1px solid currentColor; }
.fit .ico svg { width: 12px; height: 12px; }
.fit.up2 .ico, .fit.up1 .ico { color: var(--good); background: var(--good-bg); }
.fit.mid .ico { color: var(--warn); background: var(--warn-bg); }
.fit.down1 .ico, .fit.down2 .ico { color: var(--bad); background: var(--bad-bg); }

.section h2 { margin: 0 0 14px; font-size: 22px; font-weight: 800; letter-spacing: -.4px; display: flex; align-items: baseline; gap: 10px; }
.section h2 small { font: 500 12.5px var(--mono); color: var(--ink-soft); letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }

/* New offers strip */
.fresh { background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 16px 18px; }
.fresh h2 { margin: 0 0 10px; }

/* Company card */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.dim { background: transparent; border-style: dashed; }
.head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: var(--chip); display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: 15px; color: var(--ink); }
.logo.img { background: #fff; box-shadow: inset 0 0 0 1px rgba(75, 29, 38, .12); }
.logo.img img { width: 68%; height: 68%; object-fit: contain; display: block; }
.logo.img.wide img { width: 88%; }
.logo.img.fill img { width: 100%; height: 100%; }
.logo.img.fill img { object-fit: cover; }
.who { flex: 1; min-width: 0; }
.who h3 { margin: 0; font-size: 17px; font-weight: 800; line-height: 1.15; }
.who p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-soft); }
.count { flex-shrink: 0; min-width: 34px; height: 30px; padding: 0 9px; border-radius: 8px; display: grid; place-items: center; font: 500 14px var(--mono); background: var(--chip); font-variant-numeric: tabular-nums; }
.count.has { background: var(--red); color: var(--paper); }

.jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.jobs li + li { border-top: 1px solid var(--line); }
.jobs a { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; padding: 8px 0; text-decoration: none; align-items: start; }
.jobs a:hover .t { text-decoration: underline; text-underline-offset: 2px; }
.gem { width: 10px; height: 10px; margin-top: 6px; }
.gem.gd { background: var(--red); transform: rotate(45deg) scale(.85); border-radius: 2px; }
.gem.ux { background: var(--teal); border-radius: 50%; }
.gem.other { border: 1.5px solid var(--ink-soft); border-radius: 50%; }
.t { font-weight: 600; font-size: 14.5px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.where { grid-column: 2 / 4; font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.where .co { color: var(--ink); font-weight: 600; }
.jobs a.withlogo { grid-template-columns: 32px 10px minmax(0, 1fr) auto auto; column-gap: 12px; align-items: center; }
.jobs a.withlogo .logo { width: 32px; height: 32px; border-radius: 8px; font-size: 12px; }
.jobs a.withlogo .gem { margin-top: 0; }
.info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.jobs a.withlogo .where { grid-column: auto; }
.gamecol { font-size: 13.5px; font-style: italic; font-weight: 600; color: var(--ink); text-align: right; max-width: 240px; overflow-wrap: anywhere; }
@media (max-width: 520px) {
  .jobs a.withlogo { grid-template-columns: 32px 10px minmax(0, 1fr) auto; }
  .jobs a.withlogo .gamecol { grid-column: 3 / 5; grid-row: 2; text-align: left; max-width: none; }
}
.badges { display: inline-flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; align-self: center; }
.applied { display: inline-flex; align-items: center; gap: 4px; font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; padding: 2px 7px 2px 5px; border-radius: 5px; background: var(--ink); color: var(--ground); white-space: nowrap; }
.applied svg { width: 11px; height: 11px; }
.jobs li.is-applied, .picks li.is-applied { background: linear-gradient(90deg, var(--chip), transparent 70%); box-shadow: inset 3px 0 0 var(--ink); }
.jobs li.is-applied a { padding-left: 8px; }
.picks li.is-applied .pick { padding-left: 6px; }
.date { white-space: nowrap; }
.rest { margin: 14px 0 0; font-size: 13px; color: var(--ink-soft); line-height: 1.7; }
.rest a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
.new { font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--teal); color: var(--paper); align-self: center; }
.more { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--ink); font: 600 13px var(--display); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.msg { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 13px; }
.foot a { font-weight: 600; text-underline-offset: 3px; }
.foot span { font-family: var(--mono); font-size: 11.5px; color: var(--ink-soft); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .gem { margin-top: 0; }
.empty { padding: 28px; text-align: center; color: var(--ink-soft); }

@media (max-width: 520px) {
  .chips .sep { display: none; }
  .stamp { text-align: left; }
  .grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .toggle, .count { transition: background .15s, color .15s; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Job <span>Search</span></h1>
      <p>Game Design y UX en estudios de videojuegos</p>
    </div>
    <div class="stamp" id="stamp"><b>Cargando ofertas…</b></div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <span class="chips" role="group" aria-label="Filtros">
      <button class="toggle" data-f="ux" type="button" aria-pressed="true"><span class="gem ux" aria-hidden="true"></span>UX</button>
      <button class="toggle" data-f="gd" type="button" aria-pressed="true"><span class="gem gd" aria-hidden="true"></span>Game Design</button>
      <span class="sep" aria-hidden="true"></span>
      <button class="toggle" data-f="bcn" type="button" aria-pressed="true"><svg class="pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 14.5s4.5-4.2 4.5-7.8a4.5 4.5 0 0 0-9 0c0 3.6 4.5 7.8 4.5 7.8z"/><circle cx="8" cy="6.6" r="1.6"/></svg>Barcelona</button>
      <button class="toggle" data-f="remote" type="button" aria-pressed="true"><svg class="pin" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c1.8 2 1.8 10.4 0 12.4M8 1.8c-1.8 2-1.8 10.4 0 12.4"/></svg>Remoto</button>
    </span>
    <input class="search" id="f-text" type="search" placeholder="Buscar puesto o empresa" aria-label="Buscar puesto o empresa" autocomplete="off">
  </div>
  <div class="wrap summary" id="summary"></div>
</div>

<main>
  <div class="wrap layout">
    <div id="app"></div>
    <aside class="picks" id="picks" aria-labelledby="picks-title" hidden></aside>
  </div>
</main>

<script>
(function () {
  var GROUPS = [
    { id: 'mobile', name: 'Móvil y F2P' },
    { id: 'pc', name: 'PC y consola' },
    { id: 'services', name: 'Servicios para la industria' }
  ];
  var SHOW = 5;
  var state = { f: { ux: true, gd: true, bcn: true, remote: true }, text: '', open: {} };
  var applied = {};
  var data = null;

  try {
    var saved = JSON.parse(localStorage.getItem('job-search-filters-v2') || 'null');
    if (saved) Object.keys(state.f).forEach(function (k) { if (typeof saved[k] === 'boolean') state.f[k] = saved[k]; });
  } catch (e) {}

  function save() {
    try { localStorage.setItem('job-search-filters-v2', JSON.stringify(state.f)); } catch (e) {}
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function kind(j) {
    if (/artist|animator/i.test(j.title)) return 'other';
    if (/\bux\b|\bui\b|user (experience|research)|usability/i.test(j.title)) return 'ux';
    return j.design ? 'gd' : 'other';
  }

  function isNew(j) {
    if (!data || !data.updated || !j.firstSeen) return false;
    return (new Date(data.updated) - new Date(j.firstSeen)) < 1000 * 60 * 60 * 36;
  }

  function isRemote(j) { return !!j.remote || /remot|anywhere|work from home|wfh/i.test(j.location || ''); }
  function isBcn(j) { return /barcelona/i.test(j.location || ''); }

  // Chips in the same group add up (UX or Game Design). Groups narrow each
  // other (role and place). A group with nothing selected does not filter.
  function passes(j, c) {
    var f = state.f, k = kind(j);
    if ((f.ux || f.gd) && !((f.ux && k === 'ux') || (f.gd && k === 'gd'))) return false;
    if ((f.bcn || f.remote) && !((f.bcn && isBcn(j)) || (f.remote && isRemote(j)))) return false;
    var q = state.text.trim().toLowerCase();
    if (q && (j.title + ' ' + (j.location || '') + ' ' + c.name).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }
  function visible(c) {
    if (!c.jobs) return [];
    return c.jobs.filter(function (j) { return passes(j, c); });
  }
  function filtering() {
    var f = state.f;
    return f.ux || f.gd || f.bcn || f.remote || state.text.trim() !== '';
  }

  function postedDate(j) {
    if (!j.posted) return null;
    var d = new Date(j.posted);
    return isNaN(d) ? null : d;
  }
  function fmtDate(d) {
    var now = new Date();
    var opts = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString('es-ES', opts).replace('.', '');
  }
  function dateText(j) {
    var d = postedDate(j);
    return d ? 'Publicada ' + fmtDate(d) : '';
  }
  function appliedBadge() {
    var b = el('span', 'applied');
    b.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
    b.appendChild(document.createTextNode('Aplicada'));
    return b;
  }

  function initials(name) {
    return name.split(/[\s-]+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase();
  }

  // Logos: try each candidate in companies.json (self-hosted SVGs first, then
  // verified remote files), then a high-res favicon. Tiny images are rejected so
  // nothing shows pixelated. The first one that works is reused for every box.
  var logoCache = {};
  function logoSources(c) {
    var list = (c.logos || []).slice();
    if (c.domain) list.push('https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(c.domain));
    return list;
  }
  function paintLogo(box, hit) {
    box.textContent = '';
    box.className = 'logo img ' + hit.cls;
    var img = new Image(); img.alt = ''; img.src = hit.src;
    box.appendChild(img);
  }
  function resolveLogo(c, done) {
    var e = logoCache[c.id];
    if (e && e.hit !== undefined) return done(e.hit);
    if (e) return e.wait.push(done);
    e = logoCache[c.id] = { wait: [done] };
    var list = logoSources(c), i = 0;
    function finish(hit) { e.hit = hit; e.wait.forEach(function (f) { f(hit); }); e.wait = []; }
    (function next() {
      if (i >= list.length) return finish(null);
      var src = list[i++], img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, svg = /\.svg(\?|$)/i.test(src);
        if (!svg && Math.max(w, h) < 64) return next();
        var r = w && h ? w / h : 1, cls = '';
        if (r > 1.6 || r < .6) cls = 'wide';
        else if (!svg && r > .9 && r < 1.1 && !/s2\/favicons/.test(src)) cls = 'fill';
        finish({ src: src, cls: cls });
      };
      img.onerror = next;
      img.src = src;
    })();
  }
  function logo(c) {
    var box = el('div', 'logo');
    box.setAttribute('aria-hidden', 'true');
    box.textContent = initials(c.name);
    resolveLogo(c, function (hit) { if (hit) paintLogo(box, hit); });
    return box;
  }

  // Many studios put the game in the job title: "Content Designer_MONOPOLY GO!",
  // "Lead Systems Designer - Star Trek Fleet Command". Split it out when present.
  var NOT_GAME = /\b(market|remote|contract|temporary|maternity|fixed[- ]term|intern(ship)?|new games?|new project|unannounced|studios?|team|hybrid|on-?site|europe|emea|spain|barcelona|mobile|pc|console|f2p|casual|midcore|hyper-?casual|portfolio|live ?ops|automation|tools?|tech|platform|central|core|meta|economy|monetization|level|senior|junior|lead|principal|associate|ii|iii)\b/i;
  function splitGame(title) {
    var parts = title.split(/\s+[-–—|]\s+|\s*\|\s*|_/).map(function (p) { return p.trim(); }).filter(Boolean);
    if (parts.length < 2) return { role: title, game: '' };
    for (var i = 1; i < parts.length; i++) {
      var cands = parts[i].split(/\s*,\s*/);
      for (var k = 0; k < cands.length; k++) {
        var g = cands[k].replace(/[()]/g, '').trim();
        if (g.length > 2 && !NOT_GAME.test(g)) {
          var rest = parts.slice();
          rest.splice(i, 1);
          return { role: rest.join(' · '), game: g };
        }
      }
    }
    return { role: title, game: '' };
  }

  function jobRow(j, c, withCompany) {
    var li = el('li');
    var a = el('a');
    a.href = j.url; a.target = '_blank'; a.rel = 'noopener';
    var g = el('span', 'gem ' + kind(j)); g.setAttribute('aria-hidden', 'true');
    var badge = el('span', 'badges');
    var done = applied[c.id + ':' + j.id];
    if (done) { badge.appendChild(appliedBadge()); li.className = 'is-applied'; }
    if (isNew(j)) badge.appendChild(el('span', 'new', 'Nueva'));
    var place = j.location || (j.remote ? 'Remoto' : 'Sin ubicación');
    var when = dateText(j);
    if (when) place += ' · ';

    if (withCompany) {
      var split = splitGame(j.title);
      a.className = 'withlogo';
      a.appendChild(logo(c));
      a.appendChild(g);
      var info = el('span', 'info');
      info.appendChild(el('span', 't', split.role));
      var w = el('span', 'where');
      w.appendChild(el('span', 'co', c.name));
      w.appendChild(document.createTextNode(' · ' + place));
      if (when) w.appendChild(el('span', 'date', when));
      info.appendChild(w);
      a.appendChild(info);
      a.appendChild(el('span', 'gamecol', split.game));
      a.appendChild(badge);
    } else {
      a.appendChild(g);
      a.appendChild(el('span', 't', j.title));
      a.appendChild(badge);
      var wh = el('span', 'where', place);
      if (when) wh.appendChild(el('span', 'date', when));
      a.appendChild(wh);
    }
    li.appendChild(a);
    return li;
  }

  function card(c) {
    var jobs = visible(c);
    var auto = c.status === 'ok';
    var box = el('article', 'card' + (auto ? '' : ' dim'));
    var head = el('div', 'head');
    head.appendChild(logo(c));
    var who = el('div', 'who');
    who.appendChild(el('h3', null, c.name));
    if (c.note) who.appendChild(el('p', null, c.note));
    head.appendChild(who);
    if (auto) {
      var n = el('span', 'count' + (jobs.length ? ' has' : ''), String(jobs.length));
      n.setAttribute('aria-label', jobs.length + ' ofertas');
      head.appendChild(n);
    }
    box.appendChild(head);

    if (auto && jobs.length) {
      var ul = el('ul', 'jobs');
      var open = state.open[c.id];
      jobs.slice(0, open ? jobs.length : SHOW).forEach(function (j) { ul.appendChild(jobRow(j, c)); });
      box.appendChild(ul);
      if (jobs.length > SHOW) {
        var more = el('button', 'more', open ? 'Ver menos' : 'Ver ' + (jobs.length - SHOW) + ' más');
        more.type = 'button';
        more.onclick = function () { state.open[c.id] = !open; render(); };
        box.appendChild(more);
      }
    } else if (auto) {
      box.appendChild(el('p', 'msg', 'Ninguna oferta con estos filtros.'));
    } else if (c.status === 'error') {
      box.appendChild(el('p', 'msg', 'Hoy no se han podido leer sus ofertas. Consulta su web.'));
    } else if (c.status === 'pending') {
      box.appendChild(el('p', 'msg', 'Las ofertas aparecerán con la primera actualización diaria.'));
    } else {
      box.appendChild(el('p', 'msg', 'Sus ofertas solo se pueden consultar en su web.'));
    }

    var foot = el('div', 'foot');
    var link = el('a', null, 'Web de empleo ↗');
    link.href = c.careers; link.target = '_blank'; link.rel = 'noopener';
    foot.appendChild(link);
    if (auto && typeof c.total === 'number') foot.appendChild(el('span', null, c.total + ' ofertas en total'));
    else if (!auto) foot.appendChild(el('span', null, 'Revisión manual'));
    box.appendChild(foot);
    return box;
  }

  function weight(c) {
    if (c.status !== 'ok') return -1;
    return visible(c).length;
  }

  function render() {
    var app = document.getElementById('app');
    app.textContent = '';
    if (!data) return;
    var cs = data.companies || [];

    var fresh = [], total = 0, auto = 0;
    cs.forEach(function (c) {
      if (c.status === 'ok') auto++;
      visible(c).forEach(function (j) { total++; if (isNew(j)) fresh.push({ j: j, c: c }); });
    });

    var sum = document.getElementById('summary');
    sum.textContent = '';
    [[total, total === 1 ? ' oferta' : ' ofertas'], [fresh.length, fresh.length === 1 ? ' nueva' : ' nuevas'], [auto + ' de ' + cs.length, ' empresas con lectura automática']].forEach(function (p) {
      var s = el('span'); s.appendChild(el('b', null, String(p[0]))); s.appendChild(document.createTextNode(p[1])); sum.appendChild(s);
    });
    var legend = el('div', 'legend');
    [['gd', 'Game design'], ['ux', 'UX / UI'], ['other', 'Otros puestos']].forEach(function (p) {
      var s = el('span'); var g = el('span', 'gem ' + p[0]); g.setAttribute('aria-hidden', 'true'); s.appendChild(g); s.appendChild(document.createTextNode(p[1])); legend.appendChild(s);
    });
    sum.appendChild(legend);

    if (fresh.length) {
      var f = el('section', 'fresh');
      var h = el('h2', null, 'Nuevas desde ayer');
      f.appendChild(h);
      var ul = el('ul', 'jobs');
      fresh.forEach(function (p) { ul.appendChild(jobRow(p.j, p.c, true)); });
      f.appendChild(ul);
      app.appendChild(f);
    }

    GROUPS.forEach(function (g) {
      var all = cs.filter(function (c) { return c.group === g.id; });
      if (!all.length) return;
      all.sort(function (a, b) { return weight(b) - weight(a) || a.name.localeCompare(b.name); });
      var on = filtering();
      var q = state.text.trim().toLowerCase();
      var list = on ? all.filter(function (c) { return visible(c).length || (q && c.name.toLowerCase().indexOf(q) !== -1); }) : all;
      var rest = all.filter(function (c) { return list.indexOf(c) === -1; });
      var n = 0; list.forEach(function (c) { n += visible(c).length; });
      var s = el('section', 'section');
      var h2 = el('h2', null, g.name);
      h2.appendChild(el('small', null, on ? n + (n === 1 ? ' oferta · ' : ' ofertas · ') + list.length + ' de ' + all.length + ' empresas' : all.length + ' empresas'));
      s.appendChild(h2);
      if (list.length) {
        var grid = el('div', 'grid');
        list.forEach(function (c) { grid.appendChild(card(c)); });
        s.appendChild(grid);
      }
      if (rest.length) {
        var p = el('p', 'rest', (list.length ? 'Sin ofertas con estos filtros: ' : 'Ninguna empresa tiene ofertas con estos filtros: '));
        rest.forEach(function (c, i) {
          if (i) p.appendChild(document.createTextNode(', '));
          var a = el('a', null, c.name); a.href = c.careers; a.target = '_blank'; a.rel = 'noopener';
          if (c.status !== 'ok') a.title = 'Revisión manual en su web';
          p.appendChild(a);
        });
        s.appendChild(p);
      }
      app.appendChild(s);
    });
  }

  var picks = null;
  var FIT = {
    'muy alta': { cls: 'up2', d: 'M3 11l5-5 5 5M3 6l5-5 5 5' },
    'alta': { cls: 'up1', d: 'M3 10l5-5 5 5' },
    'media': { cls: 'mid', d: 'M3 6h10M3 10h10' },
    'baja': { cls: 'down1', d: 'M3 6l5 5 5-5' },
    'muy baja': { cls: 'down2', d: 'M3 5l5 5 5-5M3 10l5 5 5-5' }
  };
  function fitBadge(label) {
    var f = FIT[label.toLowerCase()] || FIT.media;
    var wrap = el('span', 'fit ' + f.cls);
    wrap.setAttribute('aria-label', 'Encaje ' + label.toLowerCase());
    var ico = el('span', 'ico');
    ico.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + f.d + '"/></svg>';
    wrap.appendChild(ico);
    var t = el('span', null, label); t.setAttribute('aria-hidden', 'true');
    wrap.appendChild(t);
    return wrap;
  }
  function renderPicks() {
    var box = document.getElementById('picks');
    box.textContent = '';
    if (!picks || !picks.picks || !data) { box.hidden = true; return; }
    var index = {};
    (data.companies || []).forEach(function (c) {
      (c.jobs || []).forEach(function (j) { index[c.id + ':' + j.id] = { j: j, c: c }; });
    });
    var list = picks.picks.filter(function (p) { return index[p.key]; });
    if (!list.length) { box.hidden = true; return; }
    box.hidden = false;
    var h = el('h2', null, 'Top 10 para ti'); h.id = 'picks-title';
    box.appendChild(h);
    var when = picks.updated ? new Date(picks.updated).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    box.appendChild(el('p', 'by', 'Elegidas por Claude' + (when ? ' · ' + when : '')));
    var ol = el('ol');
    list.forEach(function (p, i) {
      var hit = index[p.key], j = hit.j, c = hit.c;
      var split = splitGame(j.title);
      var li = el('li');
      var a = el('a', 'pick');
      a.href = j.url; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('span', 'rank', String(i + 1)));
      var top = el('span', 'ptop');
      top.appendChild(logo(c));
      var gem = el('span', 'gem ' + kind(j));
      gem.title = kind(j) === 'ux' ? 'UX / UI' : kind(j) === 'gd' ? 'Game design' : 'Otro puesto';
      top.appendChild(gem);
      top.appendChild(el('span', 't', split.role));
      if (p.fit) top.appendChild(fitBadge(p.fit));
      a.appendChild(top);
      var meta = el('span', 'meta');
      meta.appendChild(el('span', 'co', c.name));
      if (split.game) { meta.appendChild(document.createTextNode(' · ')); meta.appendChild(el('i', null, split.game)); }
      meta.appendChild(document.createTextNode(' · ' + (j.location || 'Remoto')));
      var pd = dateText(j);
      if (pd) { meta.appendChild(document.createTextNode(' · ')); meta.appendChild(el('span', 'date', pd)); }
      a.appendChild(meta);
      if (applied[p.key]) { li.className = 'is-applied'; var ab = appliedBadge(); ab.style.justifySelf = 'start'; a.appendChild(ab); }
      if (p.reason) a.appendChild(el('span', 'why', p.reason));
      li.appendChild(a);
      ol.appendChild(li);
    });
    box.appendChild(ol);
  }

  function stamp() {
    var s = document.getElementById('stamp');
    s.textContent = '';
    if (!data || !data.updated) {
      s.appendChild(el('b', null, 'Pendiente de la primera actualización'));
      s.appendChild(document.createTextNode('Se actualiza a las 7:30 y a las 19:30'));
      return;
    }
    var d = new Date(data.updated);
    var txt = d.toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    s.appendChild(el('b', null, 'Actualizado el ' + txt));
    s.appendChild(document.createTextNode('Se actualiza a las 7:30 y a las 19:30'));
  }

  function bind() {
    var text = document.getElementById('f-text');
    Array.prototype.forEach.call(document.querySelectorAll('.toggle[data-f]'), function (b) {
      var k = b.getAttribute('data-f');
      b.setAttribute('aria-pressed', String(state.f[k]));
      b.onclick = function () { state.f[k] = !state.f[k]; b.setAttribute('aria-pressed', String(state.f[k])); save(); render(); };
    });
    text.oninput = function () { state.text = text.value; render(); };
  }

  function load() {
    return fetch('jobs.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  bind();
  load()
    .then(function (d) {
      data = d;
      return fetch('applied.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (ap) {
          ((ap && ap.applied) || []).forEach(function (x) { applied[typeof x === 'string' ? x : x.key] = true; });
        })
        .catch(function () {});
    })
    .then(function () {
      if (!data) return;
      stamp(); render();
      return fetch('picks.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (pk) { picks = pk; renderPicks(); })
        .catch(function () {});
    })
    .catch(function () {
      document.getElementById('stamp').textContent = '';
      document.getElementById('stamp').appendChild(el('b', null, 'No se han podido cargar las ofertas'));
      var app = document.getElementById('app');
      app.appendChild(el('p', 'empty', 'No se encuentra el archivo de ofertas. Recarga la página en unos minutos.'));
    });
})();
</script>
