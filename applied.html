<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<body>
<title>Aplicadas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Applications history. Same palette and header as the job page. */
:root {
  --ground: #F5F0E8;
  --paper: #FFFBF4;
  --ink: #4B1D26;
  --ink-soft: #6B5357;
  --red: #B92B45;
  --teal: #0F6E62;
  --sand: #EBD3A8;
  --line: rgba(75, 29, 38, .14);
  --chip: #F1E4CF;
  --place: #2D5E8C;
  --date: #8A4F00;
  --good: #1E7A4C; --good-bg: #DCEFE3;
  --warn: #9A6200; --warn-bg: #F6E7C8;
  --bad: #B3261E; --bad-bg: #F7DCD9;
  --display: 'Bricolage Grotesque', system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1C1315; --paper: #281C1F; --ink: #F3E6E1; --ink-soft: #C4AEB0;
    --red: #E8768B; --teal: #5CC2AF; --sand: #5B4631; --line: rgba(243, 230, 225, .14);
    --chip: #3A2A22; color-scheme: dark; --place: #8DBDEB; --date: #E8B35C;
    --good: #6CCB97; --good-bg: #1F3A2B; --warn: #E6B45A; --warn-bg: #3D3020; --bad: #F08A80; --bad-bg: #44231F;
  }
}
:root[data-theme="dark"] {
  --ground: #1C1315; --paper: #281C1F; --ink: #F3E6E1; --ink-soft: #C4AEB0;
  --red: #E8768B; --teal: #5CC2AF; --sand: #5B4631; --line: rgba(243, 230, 225, .14);
  --chip: #3A2A22; color-scheme: dark; --place: #8DBDEB; --date: #E8B35C;
  --good: #6CCB97; --good-bg: #1F3A2B; --warn: #E6B45A; --warn-bg: #3D3020; --bad: #F08A80; --bad-bg: #44231F;
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--display); font-size: 15px; line-height: 1.45; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1260px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { background: var(--sand); border-bottom: 2px solid var(--ink); }
.top .wrap { padding-block: 28px 22px; display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: end; justify-content: space-between; }
.brand h1 { margin: 0; font-size: clamp(34px, 6vw, 52px); line-height: .95; font-weight: 800; letter-spacing: -1.5px; }
.brand h1 span { color: var(--red); }
.brand p { margin: 8px 0 0; color: var(--ink-soft); font-size: 16px; }
.tabs { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
.tabs a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--ink); text-decoration: none; font-weight: 600; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--sand); }
.tabs a:not([aria-current]):hover { background: rgba(75, 29, 38, .08); }
.stamp { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); text-align: right; }
.bar .wrap { padding-block: 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); color: var(--ink); font: 400 14px var(--display); }
.search::placeholder { color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
main .wrap { padding-block: 4px 56px; display: flex; flex-direction: column; gap: 36px; }
.section h2 { margin: 0 0 14px; font-size: 22px; font-weight: 800; letter-spacing: -.4px; display: flex; align-items: baseline; gap: 10px; }
.section h2 small { font: 500 12.5px var(--mono); color: var(--ink-soft); letter-spacing: 0; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; }
.row { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.row + .row { border-top: 1px solid var(--line); }
.head { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.logo { width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; background: var(--chip); display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: 18px; color: var(--ink); }
.logo.img { background: #fff; box-shadow: inset 0 0 0 1px rgba(75, 29, 38, .12); }
.logo.img img { width: 68%; height: 68%; object-fit: contain; display: block; }
.logo.img.wide img { width: 88%; }
.logo.img.fill img { width: 100%; height: 100%; object-fit: cover; }
.name { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.3px; line-height: 1.1; }
.divider { width: 1.5px; align-self: stretch; min-height: 34px; background: var(--ink); opacity: .5; }
.meta { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.about { margin: 0; font-size: 14px; color: var(--ink); text-wrap: pretty; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; align-items: center; }
.links a { color: var(--place); font-weight: 500; text-underline-offset: 2px; }
.links a.jobs { color: var(--ink); font-weight: 600; }
.bcn { font: 500 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; padding: 3px 7px; border-radius: 5px; background: var(--chip); color: var(--place); white-space: nowrap; }
.sub { margin: 0 0 -6px; font: 500 11px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); }
.games { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 18px; }
.game { display: flex; align-items: center; gap: 10px; min-width: 0; }
.game.hit .thumb { box-shadow: 0 0 0 2.5px var(--red); }
.game.hit .gname { color: var(--red); }
.thumb { width: 52px; height: 52px; flex-shrink: 0; border-radius: 11px; overflow: hidden; background: var(--chip); display: grid; place-items: center; font: 800 15px var(--display); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.dev { background: transparent; border: 1.5px dashed var(--ink-soft); box-shadow: none; }
.ginfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.gname { font-size: 14px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.gname a { text-decoration: none; }
.gname a:hover { text-decoration: underline; text-underline-offset: 2px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag { font: 500 10px var(--mono); letter-spacing: .4px; text-transform: uppercase; color: var(--date); white-space: nowrap; }
.tag.b { color: var(--place); }
.version { font-size: 13px; color: var(--ink-soft); }
.version a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
@media (max-width: 640px) {
  .divider { display: none; }
  .meta { flex-basis: 100%; }
  .games { grid-template-columns: 1fr 1fr; }
  .thumb { width: 44px; height: 44px; }
}
@media (max-width: 380px) { .games { grid-template-columns: 1fr; } }
.empty { padding: 28px; text-align: center; color: var(--ink-soft); }
@media (max-width: 520px) { .stamp { text-align: left; } }


.summary { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--ink-soft); }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }
.app { padding: 20px; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 16px; }
.app + .app { border-top: 1px solid var(--line); }
.app .logo { grid-row: 1 / span 3; }
.top-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.title { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.3px; line-height: 1.15; }
.title a { text-decoration: none; }
.title a:hover { text-decoration: underline; text-underline-offset: 3px; }
.status { font: 500 10.5px var(--mono); letter-spacing: .6px; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
.status.applied { background: var(--warn-bg); color: var(--warn); }
.status.process { background: var(--chip); color: var(--place); }
.status.offer { background: var(--good-bg); color: var(--good); }
.status.rejected, .status.withdrawn { background: var(--bad-bg); color: var(--bad); }
.sub-line { font-size: 13.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.sub-line .place { color: var(--place); }
.sub-line .when { color: var(--date); font-family: var(--mono); font-size: 12.5px; }
.closed { font: 500 10.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); }
.facts { margin: 10px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13.5px; }
.facts dt { font: 500 11px var(--mono); letter-spacing: .5px; text-transform: uppercase; color: var(--ink-soft); padding-top: 2px; }
.facts dd { margin: 0; text-wrap: pretty; }
.facts dd.stage { font-weight: 600; }
.steps { list-style: none; margin: 14px 0 0; padding: 0 0 0 4px; display: flex; flex-direction: column; gap: 10px; }
.steps li { position: relative; padding-left: 20px; font-size: 14px; text-wrap: pretty; }
.steps li::before { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 4px; top: 17px; bottom: -12px; width: 1.5px; background: var(--line); }
.steps time { display: block; font: 500 11.5px var(--mono); color: var(--date); }
.app > :not(.logo) { grid-column: 2; }
@media (max-width: 640px) {
  .app { grid-template-columns: 44px minmax(0, 1fr); padding: 16px; gap: 6px 12px; }
  .app .logo { width: 44px; height: 44px; grid-row: 1; }
  .app > :not(.logo):not(.top-line) { grid-column: 1 / -1; }
  .facts { grid-template-columns: 1fr; gap: 0; }
  .facts dd { margin-bottom: 6px; }
}

/* Sticky header: stays on top while scrolling and shrinks once the page moves. */
header.top { position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); }
header.top .wrap { transition: padding .2s ease; }
header.top .brand h1 { transition: font-size .2s ease; }
header.top.compact .wrap { padding-block: 10px; align-items: center; }
header.top.compact .brand { display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap; }
header.top.compact .brand h1 { font-size: 26px; letter-spacing: -.8px; }
header.top.compact .brand p { display: none; }
header.top.compact .tabs { margin-top: 0; }
header.top.compact .tabs a { min-height: 32px; }
header.top.compact .stamp { display: none; }
@media (prefers-reduced-motion: reduce) { header.top .wrap, header.top .brand h1 { transition: none; } }

/* Phone header: fixed height, tabs in a menu at the top right. */
.menu-btn, .menu-stamp { display: none; }
@media (max-width: 640px) {
  header.top .wrap, header.top.compact .wrap { padding-block: 10px; flex-wrap: nowrap; align-items: center; position: relative; gap: 12px; transition: none; }
  header.top .brand, header.top.compact .brand { display: block; }
  header.top .brand h1, header.top.compact .brand h1 { font-size: 26px; letter-spacing: -.8px; transition: none; }
  header.top .brand p, header.top .stamp, header.top.compact .stamp { display: none; }
  .menu-btn { display: grid; place-items: center; width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .menu-btn svg { width: 20px; height: 20px; }
  header.top.menu-open .menu-btn { background: var(--ink); color: var(--sand); }
  header.top .tabs, header.top.compact .tabs { display: none; position: absolute; top: calc(100% + 4px); right: max(16px, env(safe-area-inset-right, 0px)); margin: 0; flex-direction: column; align-items: stretch; gap: 6px; min-width: 230px; padding: 12px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); z-index: 40; }
  header.top.menu-open .tabs { display: flex; }
  header.top .tabs a, header.top.compact .tabs a { min-height: 44px; }
  header.top .tabs .menu-stamp { display: block; margin: 4px 2px 0; font: 400 11.5px var(--mono); color: var(--ink-soft); }
  header.top .tabs .menu-stamp:empty { display: none; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Job <span>Search</span></h1>
      <p>Game Design y UX en estudios de videojuegos</p>
      <nav class="tabs" id="site-nav" aria-label="Secciones">
        <a href="./">Ofertas</a>
        <a href="applied.html" aria-current="page">Aplicadas</a>
        <a href="games.html">Empresas y juegos</a>

        <p class="menu-stamp" aria-live="polite"></p>

  </div>
</header>

<div class="bar"><div class="wrap"><div class="summary" id="summary"></div></div></div>

<main><div class="wrap" id="app"></div></main>

<script>
(function () {
  var STATUS = {
    applied: 'Aplicada',
    process: 'En proceso',
    offer: 'Oferta',
    rejected: 'Descartada',
    withdrawn: 'Retirada'
  };
  var ACTIVE = { applied: 1, process: 1 };
  var MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function initials(name) { return name.split(/[\s-]+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
  // Dates are "YYYY-MM-DD" or "YYYY-MM" when the day is unknown.
  function fmt(d) {
    if (!d) return '';
    var p = String(d).split('-').map(Number);
    if (p.length < 3) return MONTHS[p[1] - 1] + ' ' + p[0];
    return p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0];
  }
  var logoCache = {};
  function logoSources(c) {
    var list = (c.logos || []).slice();
    if (c.domain) list.push('https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(c.domain));
    return list;
  }
  function resolveLogo(c, done) {
    var e = logoCache[c.id];
    if (e && e.hit !== undefined) return done(e.hit);
    if (e) return e.wait.push(done);
    e = logoCache[c.id] = { wait: [done] };
    var list = logoSources(c), i = 0;
    function finish(hit) { e.hit = hit; e.wait.forEach(function (f) { f(hit); }); e.wait = []; }
    (function next() {
      if (i >= list.length) return finish(null);
      var src = list[i++], img = new Image();
      img.onload = function () {
        var w = img.naturalWidth, h = img.naturalHeight, svg = /\.svg(\?|#|$)/i.test(src);
        if (!svg && Math.max(w, h) < 64) return next();
        var r = w && h ? w / h : 1, cls = '';
        if (/#fill$/.test(src)) cls = 'fill';
        else if (r > 1.6 || r < .6) cls = 'wide';
        else if (!svg && r > .9 && r < 1.1 && !/s2\/favicons/.test(src)) cls = 'fill';
        finish({ src: src, cls: cls });
      };
      img.onerror = next;
      img.src = src;
    })();
  }
  function logo(c) {
    var box = el('div', 'logo');
    box.setAttribute('aria-hidden', 'true');
    box.textContent = initials(c.name);
    resolveLogo(c, function (hit) {
      if (!hit) return;
      box.textContent = '';
      box.className = 'logo img ' + hit.cls;
      var img = new Image(); img.alt = ''; img.src = hit.src; box.appendChild(img);
    });
    return box;
  }

  function card(a, c, open) {
    var row = el('article', 'app');
    row.appendChild(logo(c));
    var top = el('div', 'top-line');
    var h = el('h3', 'title');
    if (a.url) { var link = el('a', null, a.title); link.href = a.url; link.target = '_blank'; link.rel = 'noopener'; h.appendChild(link); }
    else h.textContent = a.title;
    top.appendChild(h);
    top.appendChild(el('span', 'status ' + (a.status || 'applied'), STATUS[a.status] || STATUS.applied));
    if (open === false && ACTIVE[a.status || 'applied']) top.appendChild(el('span', 'closed', 'Oferta ya cerrada'));
    row.appendChild(top);

    var sub = el('div', 'sub-line');
    sub.appendChild(el('span', null, c.name + (a.team ? ' · ' + a.team : '')));
    if (a.location) sub.appendChild(el('span', 'place', a.location));
    sub.appendChild(el('span', 'when', 'Aplicada el ' + fmt(a.date)));
    row.appendChild(sub);

    var body = el('div');
    var dl = el('dl', 'facts');
    [['En qué punto estoy', a.stage, 'stage'], ['Qué envié', a.cv], ['Referral', a.referral]].forEach(function (f) {
      if (!f[1]) return;
      dl.appendChild(el('dt', null, f[0]));
      dl.appendChild(el('dd', f[2] || null, f[1]));
    });
    body.appendChild(dl);
    if (a.steps && a.steps.length) {
      var ol = el('ol', 'steps');
      a.steps.forEach(function (s) {
        var li = el('li');
        var t = el('time', null, fmt(s.date)); t.setAttribute('datetime', s.date);
        li.appendChild(t);
        li.appendChild(document.createTextNode(s.text));
        ol.appendChild(li);
      });
      body.appendChild(ol);
    }
    row.appendChild(body);
    return row;
  }

  function section(title, list, byId, openFor) {
    var s = el('section', 'section');
    var h2 = el('h2', null, title);
    h2.appendChild(el('small', null, list.length + (list.length === 1 ? ' candidatura' : ' candidaturas')));
    s.appendChild(h2);
    var panel = el('div', 'panel');
    list.forEach(function (a) {
      var id = a.company || a.key.split(':')[0];
      panel.appendChild(card(a, byId[id] || { id: id, name: id }, openFor(a)));
    });
    s.appendChild(panel);
    return s;
  }

  Promise.all([
    fetch('applied.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }),
    fetch('companies.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }),
    fetch('jobs.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; })
  ]).then(function (res) {
    var list = (res[0].applied || []).map(function (x) { return typeof x === 'string' ? { key: x } : x; })
      .filter(function (a) { return a.title; });
    var byId = {};
    (res[1] || []).forEach(function (c) { byId[c.id] = c; });
    var openKeys = null;
    if (res[2] && res[2].companies) {
      openKeys = {};
      res[2].companies.forEach(function (c) {
        if (!byId[c.id]) byId[c.id] = c;
        if (c.status !== 'ok') return;
        (c.jobs || []).forEach(function (j) { openKeys[c.id + ':' + j.id] = true; });
        openKeys['__read:' + c.id] = true;
      });
    }
    // Only say an offer closed when its company's portal was read today.
    function openFor(a) {
      if (!openKeys) return null;
      var id = a.key.split(':')[0];
      return openKeys['__read:' + id] ? !!openKeys[a.key] : null;
    }
    list.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    var active = list.filter(function (a) { return ACTIVE[a.status || 'applied']; });
    var done = list.filter(function (a) { return !ACTIVE[a.status || 'applied']; });

    var sum = document.getElementById('summary');
    [[list.length, list.length === 1 ? ' candidatura' : ' candidaturas'], [active.length, active.length === 1 ? ' activa' : ' activas'], [done.length, done.length === 1 ? ' cerrada' : ' cerradas']].forEach(function (p) {
      var s = el('span'); s.appendChild(el('b', null, String(p[0]))); s.appendChild(document.createTextNode(p[1])); sum.appendChild(s);
    });
    if (list.length) document.getElementById('stamp').textContent = 'Última candidatura: ' + fmt(list[0].date);

    var app = document.getElementById('app');
    if (active.length) app.appendChild(section('En curso', active, byId, openFor));
    if (done.length) app.appendChild(section('Cerradas', done, byId, openFor));
    if (!list.length) app.appendChild(el('p', 'empty', 'Todavía no hay candidaturas.'));
  }).catch(function () {
    document.getElementById('app').appendChild(el('p', 'empty', 'No se han podido cargar las candidaturas. Recarga la página en unos minutos.'));
  });
})();
</script>

<script>
// Sticky header: compact after a little scroll; expose its height for other sticky panels.
(function () {
  var head = document.querySelector('header.top');
  if (!head) return;
  function setH() { document.documentElement.style.setProperty('--head-h', head.offsetHeight + 'px'); }
  var compact = false;
  function onScroll() {
    var y = window.scrollY || 0;
    var next = compact ? y > 24 : y > 80;
    if (next !== compact) { compact = next; head.classList.toggle('compact', compact); setH(); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', setH);
  if (window.ResizeObserver) new ResizeObserver(setH).observe(head);
  setH(); onScroll();
})();

// Phone menu: the section tabs open from the button at the top right.
(function () {
  var head = document.querySelector('header.top'), btn = head && head.querySelector('.menu-btn');
  if (!btn) return;
  var stampLine = head.querySelector('.menu-stamp'), stamp = document.getElementById('stamp');
  function set(open) {
    head.classList.toggle('menu-open', open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
    if (open && stampLine && stamp) stampLine.textContent = Array.prototype.map.call(stamp.childNodes, function (n) { return n.textContent.trim(); }).filter(Boolean).join(' · ');
  }
  btn.onclick = function (e) { e.stopPropagation(); set(!head.classList.contains('menu-open')); };
  document.addEventListener('click', function (e) { if (!head.querySelector('.tabs').contains(e.target)) set(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && head.classList.contains('menu-open')) { set(false); btn.focus(); } });
})();
</script>

</body>
