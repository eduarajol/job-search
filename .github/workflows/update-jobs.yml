name: Update jobs

on:
  schedule:
    # Every day at 05:17 UTC (about 6-7 am in Barcelona)
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch open positions
        run: python scripts/fetch_jobs.py

      - name: Save jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git push
