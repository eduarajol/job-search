name: Update jobs

on:
  schedule:
    # Target: 7:30 and 19:30 in Barcelona. GitHub often starts scheduled runs
    # hours late (or drops them), so several slots are listed and each run
    # simply skips when the data is already fresh. The Top-10 scheduled task
    # also starts this workflow by hand (workflow_dispatch) when it finds
    # stale data, so it no longer depends on GitHub's timing.
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
    - cron: "17 9 * * *"
    - cron: "17 17 * * *"
    - cron: "17 18 * * *"
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if data is fresh
        id: when
        env:
          EVENT: ${{ github.event_name }}
        run: |
          run=true
          if [ "$EVENT" = "schedule" ] && [ -f details.json ]; then
            age=$(python3 -c "import json,datetime as d;u=d.datetime.fromisoformat(json.load(open('details.json'))['updated']);print(int((d.datetime.now(d.timezone.utc)-u).total_seconds()))")
            # Fresh = updated in the last 5 hours
            if [ "$age" -lt 18000 ]; then run=false; fi
            echo "details.json age ${age}s"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "event $EVENT, run=$run"

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch open positions
        if: steps.when.outputs.run == 'true'
        run: python scripts/fetch_jobs.py

      - name: Save jobs.json
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs.json details.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
