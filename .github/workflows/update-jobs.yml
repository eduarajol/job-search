name: Update jobs

on:
  schedule:
    # 7:30 and 19:30 in Barcelona. GitHub schedules run in UTC, so both the
    # summer (UTC+2) and winter (UTC+1) times are listed and the first step
    # skips the pair that does not match the current Barcelona offset.
    - cron: "30 5 * * *"   # 7:30 summer
    - cron: "30 17 * * *"  # 19:30 summer
    - cron: "30 6 * * *"   # 7:30 winter
    - cron: "30 18 * * *"  # 19:30 winter
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Barcelona time
        id: when
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          run=true
          if [ -n "$SCHEDULE" ]; then
            offset=$(TZ=Europe/Madrid date +%z)
            case "$offset:$SCHEDULE" in
              "+0200:30 5 * * *"|"+0200:30 17 * * *"|"+0100:30 6 * * *"|"+0100:30 18 * * *") run=true ;;
              *) run=false ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Barcelona offset $(TZ=Europe/Madrid date +%z), schedule '$SCHEDULE', run=$run"

      - uses: actions/checkout@v4
        if: steps.when.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.when.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch open positions
        if: steps.when.outputs.run == 'true'
        run: python scripts/fetch_jobs.py

      - name: Save jobs.json
        if: steps.when.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add jobs.json details.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
