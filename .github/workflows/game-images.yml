name: Update game images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find thumbnails
        run: python scripts/game_images.py
      - name: Save game_images.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add game_images.json
          git diff --cached --quiet || git commit -m "Update game images $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
